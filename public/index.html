<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SocratiK</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <header>
      <h1>SocratiK</h1>
      <p class="subtitulo">
        Plataforma de diagnóstico cognitivo y aprendizaje basado en el error.
      </p>
    </header>

    <main>
      <label for="selectEjercicio">Elegí un ejercicio:</label>
      <select id="selectEjercicio"></select>

      <div id="enunciadoBox" class="caja-enunciado" hidden>
        <strong>Enunciado:</strong>
        <p id="enunciadoTexto"></p>
      </div>

      <label for="codigo">Tu intento de solución:</label>
      <textarea id="codigo" placeholder="Escribí tu código acá..."></textarea>

      <button id="btnEnviar">Analizar mi intento</button>

      <p id="mensajeEstado" class="mensaje-estado"></p>
    </main>

    <script src="js/inicio.js"></script>
  </body>
</html>
