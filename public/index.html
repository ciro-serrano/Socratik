<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SocratiK</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <header>
      <h1>SocratiK</h1>
      <p class="subtitulo">
        Plataforma de diagnóstico cognitivo y aprendizaje basado en el error.
      </p>
    </header>

    <main>
      <label for="selectEjercicio">Elegí un ejercicio:</label>
      <select id="selectEjercicio"></select>

      <div id="enunciadoBox" class="caja-enunciado" hidden>
        <strong>Enunciado:</strong>
        <p id="enunciadoTexto"></p>
      </div>

      <div id="formPersonalizado" hidden>
        <label for="conceptoPersonalizado"
          >¿Qué concepto querés practicar?</label
        >
        <select id="conceptoPersonalizado">
          <option value="loops">Loops / bucles</option>
          <option value="condicionales">Condicionales</option>
          <option value="recursividad">Recursividad</option>
          <option value="arrays">Arrays</option>
          <option value="strings">Strings</option>
        </select>

        <label for="nivelPersonalizado">Nivel:</label>
        <select id="nivelPersonalizado">
          <option value="basico">Básico</option>
          <option value="intermedio">Intermedio</option>
          <option value="avanzado">Avanzado</option>
        </select>

        <button id="btnGenerarEjercicio" type="button">
          Generar ejercicio con IA
        </button>
        <p id="mensajeGenerando" class="mensaje-estado"></p>
      </div>

      <label for="codigo">Tu intento de solución:</label>
      <textarea id="codigo" placeholder="Escribí tu código acá..."></textarea>

      <button id="btnEnviar">Analizar mi intento</button>

      <p id="mensajeEstado" class="mensaje-estado"></p>
    </main>

    <script src="js/inicio.js"></script>
  </body>
</html>
