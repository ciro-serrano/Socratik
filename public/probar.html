<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>SocratiK - Prueba</title>
    <link rel="stylesheet" href="css/estilos.css" />
    <style>
      textarea {
        width: 100%;
        height: 120px;
        font-family: monospace;
      }
      pre {
        background: #f4f4f4;
        padding: 1rem;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Prueba de diagnóstico</h1>
    <p>Ejercicio id: <input type="number" id="ejercicioId" value="1" /></p>
    <p>Código del alumno (con el error a propósito):</p>
    <textarea id="codigo">
function sumaPares(arr) { return arr.reduce((a,b) => a+b, 0); }</textarea
    >
    <br /><br />
    <button onclick="probar()">Enviar a SocratiK</button>

    <h3>Resultado:</h3>
    <pre id="resultado">Todavía nada...</pre>

    <script>
      async function probar() {
        const resultado = document.getElementById("resultado");
        resultado.textContent = "Procesando... (puede tardar unos segundos)";

        try {
          const response = await fetch("/api/diagnostico", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              ejercicio_id: Number(
                document.getElementById("ejercicioId").value,
              ),
              codigo: document.getElementById("codigo").value,
            }),
          });

          const data = await response.json();
          resultado.textContent = JSON.stringify(data, null, 2);
        } catch (err) {
          resultado.textContent = "Error: " + err.message;
        }
      }
    </script>
  </body>
</html>
